version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    # minimatch and glob come in only under c8 (coverage, dev-only) and are
    # forced to the fixed lines by "overrides" in package.json. Dependabot's
    # security update cannot move them inside c8's range and fails every run.
    ignore:
      - dependency-name: minimatch
      - dependency-name: glob
  - package-ecosystem: npm
    directory: /history-server
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  # The history server's Node base image. The main Dockerfile's Playwright
  # image is not listed here on purpose: it has to move with playwright-core,
  # so the npm update for playwright-core fails test/version-pins.test.mjs
  # until the Dockerfile, the CI templates and the pytest pin move with it.
  - package-ecosystem: docker
    directory: /history-server
    schedule:
      interval: monthly
